name: CI
on:
  push:
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats, shellcheck, sqlite3, tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck sqlite3 tmux jq
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/mesh.sh scripts/helpers.sh \
            install.sh uninstall.sh agent-mesh.tmux bin/tmux-agent-mesh
      # lib/ is vendored from KakkoiDev/tmux-toolkit via git subtree. Editing it
      # in place here is how five plugins accumulated 26 duplicated helpers in
      # the first place, so a drifted copy fails the build. Fix it upstream and
      # run `make fanout` in the toolkit.
      - name: lib/ has not drifted from its tagged source
        run: |
          have=$(find lib -name '*.sh' | sort | xargs shasum | shasum | cut -d' ' -f1)
          want=$(cat lib/.checksum)
          if [ "$have" != "$want" ]; then
            echo "lib/ has drifted from tmux-toolkit $(cat lib/VERSION)" >&2
            echo "  expected $want" >&2
            echo "  actual   $have" >&2
            exit 1
          fi
          echo "lib/ matches tmux-toolkit $(cat lib/VERSION)"
      # The bash copy of the schema is generated, not written. A hand edit to
      # either side is how mesh.db ended up with two incompatible definitions of
      # `messages` pointed at one file.
      - name: mesh.sh schema matches internal/store/schema.sql
        run: scripts/gen-schema.sh --check

      - name: bats
        run: bats tests/

  # The suite runs under bash 3.2 on macOS, which is the oldest supported shell
  # and the one where a bare [[ ]] assertion silently passes. Both platforms run,
  # because a green Linux run says nothing about the shell most contributors have.
  bats-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # tmux too: tests/tmux.bats starts a server on a private socket, and the
      # GitHub macOS image does not ship one, so every one of those tests failed
      # in start_test_tmux while the Linux job passed them.
      - name: Install bats and tmux
        run: brew install bats-core tmux
      # Pin the interpreter, do not merely print it. `bats` on macOS resolves to
      # whichever bash is first on PATH, and brew's bash 5 often is, which
      # silently stops exercising the one tier this job exists for.
      - name: confirm /bin/bash is 3.2
        run: /bin/bash --version | head -1 | grep 'version 3'
      - name: bats under bash 3.2
        run: /bin/bash "$(command -v bats)" tests/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: test
        run: go test ./...

